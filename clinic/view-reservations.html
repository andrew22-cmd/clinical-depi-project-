<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>View Reservations</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar">
      <div class="brand">🛠️ <span>Manager Panel</span></div>
      <ul class="nav-list">
        <li><a class="nav-link" href="manager-dashboard.html">Manage Doctors</a></li>
        <li><a class="nav-link" href="manage-users.html">Manage Users</a></li>
        <li><a class="nav-link" href="doctors-schedules.html">Manage Schedule</a></li>
        <li><a class="nav-link active" href="view-reservations.html">View Reservations</a></li>
        <li><a class="nav-link" href="manager-dashboard.html">Reports</a></li>
      </ul>
    </aside>

    <main class="main">
      <div class="topbar">
        <div>
          <h2>حجوزات اليوم</h2>
          <p class="muted">عرض الحجوزات حسب التاريخ المختار (يمكن اختيار أمس/اليوم/غداً أو أي تاريخ).</p>
        </div>
        <div class="actions">
          <button class="btn btn-outline" onclick="goTo('manager-dashboard.html')">الرجوع للخلف</button>
        </div>
      </div>

      <section class="card" style="margin-bottom:1rem;">
        <div class="actions">
          <button class="btn btn-outline" type="button" onclick="shiftReservationDate(-1)">اليوم السابق</button>
          <input id="reservationDateFilter" class="form-control" type="date" style="max-width:220px;" onchange="renderReservationsByDate()">
          <button class="btn btn-outline" type="button" onclick="shiftReservationDate(1)">اليوم التالي</button>
          <button class="btn btn-primary" type="button" onclick="setReservationFilterToday()">اليوم</button>
        </div>
      </section>

      <section class="card">
        <div class="table-wrap">
          <table>
            <thead>
              <tr>
                <th>المريض</th>
                <th>الهاتف</th>
                <th>الطبيب</th>
                <th>اليوم</th>
                <th>الوقت</th>
                <th>المصدر</th>
              </tr>
            </thead>
            <tbody id="reservationListByDateBody"></tbody>
          </table>
        </div>
      </section>
    </main>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
