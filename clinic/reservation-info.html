<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reservation Info</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
  <div class="container page-pad" style="max-width:760px;">
    <div class="topbar">
      <h2>Reservation Summary</h2>
      <div class="actions">
        <button class="btn btn-outline" onclick="goTo('reservation.html')">تعديل</button>
      </div>
    </div>

    <section class="card">
      <h3>بيانات الحجز</h3>
      <p><strong>Doctor:</strong> <span id="resDoctor">-</span></p>
      <p><strong>Date:</strong> <span id="resDay">-</span></p>
      <p><strong>Time:</strong> <span id="resTime">-</span></p>
      <p><strong>Payment info:</strong> <span class="muted">Placeholder - سيتم الربط لاحقاً.</span></p>

      <div class="actions" style="margin-top: 1rem;">
        <button class="btn btn-primary" onclick="goTo('email-notification.html')">إرسال التأكيد بالبريد</button>
        <button class="btn btn-outline" onclick="goTo('user-dashboard.html')">العودة للوحة المستخدم</button>
      </div>
    </section>
  </div>

  <script src="assets/script.js"></script>
</body>
</html>
